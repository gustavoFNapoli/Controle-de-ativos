{% extends "base.html" %}

{% block title %}Novo Ativo | Controle de Ativos{% endblock %}

{% block body %}

<section class="page-header">
    <div>
        <h1>Novo ativo</h1>
        <p>Preencha os dados para cadastrar um ativo no sistema.</p>
    </div>
</section>

<section class="content-card">

    {% if erro %}
        <div class="error-message">
            {{ erro }}
        </div>
    {% endif %}

    <form method="POST" action="{{ url_for('ativos.novo_ativo') }}">

        <div class="form-group">
            <label for="nome">Nome do ativo</label>
            <input
                type="text"
                id="nome"
                name="nome"
                value="{{ formulario.get('nome', '') }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="categoria">Categoria</label>

            <select id="categoria" name="categoria" required>
                <option value="" disabled selected hidden>Selecionar categoria</option>
                <option value="1"
                    {% if formulario.get('Servidor') == '1' %}selected{% endif %}>
                    Servidor
                </option>

                <option value="2"
                    {% if formulario.get('Software Licenciado') == '2' %}selected{% endif %}>
                    Software Licenciado
                </option>

                <option value="3"
                    {% if formulario.get('Banco de dados') == '3' %}selected{% endif %}>
                    Banco de dados
                </option>

                <option value="4"
                    {% if formulario.get('Aplicação') == '4' %}selected{% endif %}>
                    Aplicação
                </option>

                <option value="5"
                    {% if formulario.get('Equipamento') == '5' %}selected{% endif %}>
                    Equipamento
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="responsavel">Responsável</label>
            <input
                type="text"
                id="responsavel"
                name="responsavel"
                value="{{ formulario.get('responsavel', '') }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="setor">Setor</label>
            <input
                type="text"
                id="setor"
                name="setor"
                value="{{ formulario.get('setor', '') }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="localizacao">Localização</label>
            <input
                type="text"
                id="localizacao"
                name="localizacao"
                value="{{ formulario.get('localizacao', '') }}"
                required
            >
        </div>

        <div class="form-actions">
            <a href="{{ url_for('ativos.listar_ativos') }}" class="btn-secondary">
                Cancelar
            </a>

            <button type="submit" class="btn-primary">
                Cadastrar ativo
            </button>
        </div>

    </form>

</section>

{% endblock %}
