{% extends "base.html" %}

{% block title %}Nova vulnerabilidade | Controle de Ativos{% endblock %}

{% block body %}

<section class="page-header">
    <div>
        <h1>Nova vulnerabilidade</h1>
        <p>Preencha os dados para cadastrar uma vulnerabilidade no sistema.</p>
    </div>
</section>

<section class="content-card">

    {% if erro %}
        <div class="error-message">
            {{ erro }}
        </div>
    {% endif %}

    <form method="POST" action="{{ url_for('vulnerabilidades.nova_vulnerabilidade') }}">

        <div class="form-group">
            <label for="vulnerabilidade">Vulnerabilidade</label>
            <input
                type="text"
                id="vulnerabilidade"
                name="vulnerabilidade"
                value="{{ formulario.get('vulnerabilidade', '') }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="severidade">Severidade</label>

            <select id="severidade" name="severidade" required>
                <option value="" disabled selected hidden>Selecionar uma severidade</option>
                <option value="1"
                    {% if formulario.get('Baixa') == '1' %}selected{% endif %}>
                    Baixa
                </option>

                <option value="2"
                    {% if formulario.get('Media') == '2' %}selected{% endif %}>
                    Media
                </option>

                <option value="3"
                    {% if formulario.get('Alta') == '3' %}selected{% endif %}>
                    Alta
                </option>

                <option value="4"
                    {% if formulario.get('Critica') == '4' %}selected{% endif %}>
                    Critica
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="tipo">Tipo</label>
            <select id="tipo" name="tipo" required>
                <option value="" disabled selected hidden>Selecionar tipo de vulnerabilidade</option>
                <option value="1"
                    {% if formulario.get('Software') == '1' %}selected{% endif %}>
                    Software
                </option>

                <option value="2"
                    {% if formulario.get('Rede/Infra') == '2' %}selected{% endif %}>
                    Rede/Infra
                </option>

                <option value="3"
                    {% if formulario.get('Configuracao') == '3' %}selected{% endif %}>
                    Configuracao
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="status">Status</label>
            <select id="status" name="status" required>
                <option value="" disabled selected hidden>Selecionar status da vulnerabilidade</option>
                <option value="1"
                    {% if formulario.get('Resolvido') == '1' %}selected{% endif %}>
                    Resolvido
                </option>

                <option value="2"
                    {% if formulario.get('Em analise') == '2' %}selected{% endif %}>
                    Em analise
                </option>

                <option value="3"
                    {% if formulario.get('Aceito') == '3' %}selected{% endif %}>
                    Aceito
                </option>
            </select>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('vulnerabilidades.listar_vulnerabilidades') }}" class="btn-secondary">
                Cancelar
            </a>

            <button type="submit" class="btn-primary">
                Cadastrar ativo
            </button>
        </div>

    </form>

</section>

{% endblock %}
