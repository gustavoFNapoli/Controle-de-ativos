{% extends "base.html" %}

{% block title %}Entrar | Controle de Ativos{% endblock %}

{% block body %}
<section class="content-card login-card">
    <div class="content-card-header">
        <h1>Entrar no sistema</h1>
    </div>
    <div class="login-content">
        <p>Informe suas credenciais para acessar o inventário.</p>
        {% if erro %}
            <div class="error-message" role="alert">{{ erro }}</div>
        {% endif %}
        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="form-group">
                <label for="username">Usuário</label>
                <input id="username" name="username" type="text" maxlength="80" autocomplete="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-primary">Entrar</button>
        </form>
    </div>
</section>
{% endblock %}
