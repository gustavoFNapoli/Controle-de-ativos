services:
  mariadb:
    image: mariadb:11
    container_name: sistema_mariadb
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: 123456
      MARIADB_DATABASE: controle_ativos
      MARIADB_USER: gustavo
      MARIADB_PASSWORD: 123456

    ports:
      - "3306:3306"

    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data: