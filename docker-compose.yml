services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Configure DB_ROOT_PASSWORD no arquivo .env}
      MARIADB_DATABASE: ${DB_NAME:-controle_ativos}
      MARIADB_USER: ${DB_USER:?Configure DB_USER no arquivo .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD no arquivo .env}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-controle_ativos}
      DB_USER: ${DB_USER:?Configure DB_USER no arquivo .env}
      DB_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD no arquivo .env}
      SECRET_KEY: ${SECRET_KEY:?Configure SECRET_KEY no arquivo .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "666:5000"
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data:
